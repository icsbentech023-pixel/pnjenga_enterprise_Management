<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f35">
<meta name="description" content="PNJENGA ENTERPRISE business management for Gathaiti and Kanjuku.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>PNJENGA ENTERPRISE</title>
<style>
:root{color-scheme:light;--green:#173f35;--gold:#d9b45e}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f3f6f3;color:#172b24}.shell{height:100dvh;display:flex;flex-direction:column}.bar{min-height:58px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}.mark{height:36px;width:36px;border-radius:10px;background:var(--gold);color:var(--green);display:grid;place-items:center;font-size:20px}.actions{display:flex;align-items:center;gap:8px}.actions button,.actions a{border:1px solid #ffffff55;border-radius:8px;background:#ffffff12;color:#fff;padding:8px 11px;text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}.frame-wrap{position:relative;flex:1;min-height:0;background:#fff}.app-frame{border:0;width:100%;height:100%;display:block;background:#fff}.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#f3f6f3}.fallback div{max-width:420px}.fallback a{display:inline-block;margin-top:12px;background:var(--green);color:white;padding:12px 18px;border-radius:8px;text-decoration:none;font-weight:700}.foot{font-size:11px;text-align:center;color:#66766e;padding:5px;background:#edf2ee}@media(max-width:480px){.bar{min-height:52px;padding:7px 9px}.brand{font-size:12px}.mark{width:32px;height:32px}.actions button,.actions a{font-size:11px;padding:7px}}
</style>
</head>
<body>
<div class="shell">
<header class="bar"><div class="brand"><span class="mark">P</span><span>PNJENGA ENTERPRISE</span></div><div class="actions"><button id="installBtn" hidden>Install app</button><a href="https://script.google.com/macros/s/AKfycbzoB2ejSGFQN_QCp2JpwyYatghyIy0j5loXEkfDbHhCo0DE-eU8yXOCHT0ed1OjD-Bc/exec" target="_blank" rel="noopener">Open separately ↗</a></div></header>
<main class="frame-wrap">
<iframe class="app-frame" id="businessApp" title="PNJENGA ENTERPRISE business application" src="https://script.google.com/macros/s/AKfycbzoB2ejSGFQN_QCp2JpwyYatghyIy0j5loXEkfDbHhCo0DE-eU8yXOCHT0ed1OjD-Bc/exec" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div class="fallback" id="fallback"><div><h2>Open PNJENGA ENTERPRISE</h2><p>If the embedded app does not load in this browser, open the secure Google Apps Script app directly.</p><a href="https://script.google.com/macros/s/AKfycbzoB2ejSGFQN_QCp2JpwyYatghyIy0j5loXEkfDbHhCo0DE-eU8yXOCHT0ed1OjD-Bc/exec" target="_blank" rel="noopener">Open business app</a></div></div>
</main><footer class="foot">Gathaiti &amp; Kanjuku · Live records are stored in the connected Google Sheet</footer>
</div>
<script>
let installPrompt=null;const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installBtn.hidden=false});
installBtn.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installBtn.hidden=true});
window.addEventListener('appinstalled',()=>{installBtn.hidden=true});
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
