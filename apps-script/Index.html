<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17212b;font:15px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #10203012}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{font-size:25px;font-weight:700;margin-top:8px}label{display:block;margin:8px 0}input,button{font:inherit;padding:11px;border:1px solid #cbd5df;border-radius:8px}button{background:#145b42;color:white;border:0;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #e5eaf0}th{background:#f7f9fa}.muted{color:#657482}.scroll{overflow:auto}a{color:#145b42}
</style></head><body><main class="wrap"><h1>PNJENGA ENTERPRISE — Owner dashboard</h1><p class="muted">Gathaiti & Kanjuku · Google Sheets live data</p><section class="card" id="login"><label>Owner PIN</label><input id="pin" type="password"><button onclick="load()">Open dashboard</button><p id="msg"></p></section><div id="dash" style="display:none"><section class="grid" id="metrics"></section><section class="card"><h2>Daily performance</h2><div class="scroll" id="days"></div></section><section class="card"><h2>Stock on hand & reorder alerts</h2><div class="scroll" id="stock"></div></section><section class="card"><h2>M-Pesa reconciliation</h2><div class="scroll" id="mpesa"></div></section><p class="muted" id="updated"></p><button onclick="load()">Refresh dashboard</button> <a href="?">Open data entry</a></div></main>
<script>
function call(fn,...args){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(e))[fn](...args))}
function money(n){return 'KES '+Number(n||0).toLocaleString('en-KE',{maximumFractionDigits:2})}
function table(headers,rows){return '<table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function safe(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function load(){let pin=document.getElementById('pin').value;try{let d=await call('getData',pin),sum=d.recs.reduce((a,r)=>{for(let k of ['gSales','gGross','aSales','aGross','mComm','expenses'])a[k]+=Number(r[k]||0);return a},{gSales:0,gGross:0,aSales:0,aGross:0,mComm:0,expenses:0});document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';
let cards=[['Gas sales',sum.gSales],['Agrovet sales',sum.aSales],['Gross trading profit',sum.gGross+sum.aGross],['M-Pesa commission',sum.mComm],['Expenses',sum.expenses],['Net before other costs',sum.gGross+sum.aGross+sum.mComm-sum.expenses]];
document.getElementById('metrics').innerHTML=cards.map(c=>'<section class="card"><div class="muted">'+c[0]+'</div><div class="metric">'+money(c[1])+'</div></section>').join('');
document.getElementById('days').innerHTML=table(['Date','Business','Gas sales','Gas gross','Agrovet sales','Agrovet gross','M-Pesa commission','Expenses'],d.recs.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>[safe(r.date),safe(r.business),money(r.gSales),money(r.gGross),money(r.aSales),money(r.aGross),money(r.mComm),money(r.expenses)]));
document.getElementById('stock').innerHTML=table(['Business','Category','Item','Received','Sold','Balance','Reorder level','Status'],d.stock.map(r=>[safe(r.business),safe(r.cat),safe(r.item),r.received,r.sold,r.balance,r.level??'—',r.level!=null&&r.balance<=r.level?'<b style="color:#b42318">REORDER</b>':'OK']));
document.getElementById('mpesa').innerHTML=table(['Date','Business','Deposits','Withdrawals','Commission','Variance'],d.mpesa.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>[safe(r.date),safe(r.business),money(r.dep),money(r.wd),money(r.comm),'<b style="color:'+(Math.abs(r.variance)>.01?'#b42318':'#147d45')+'">'+money(r.variance)+'</b>']));
document.getElementById('updated').textContent='Updated '+new Date(d.updated).toLocaleString()}catch(e){document.getElementById('msg').textContent=e.message}}
</script></body></html>
